<div class="login-container">
  <!-- Background Image -->
  <div class="background-image-wrapper">
    <img src="assets/backgroundimage.jpg" alt="Background" class="background-image" />
    <div class="image-overlay"></div>
  </div>

  <!-- Login Form Overlay -->
  <div class="form-overlay">
    <div class="form-content">
      <!-- Brand Logo -->
      <img src="assets/logo.png" alt="Sankalp" class="brand-logo" />

      <!-- Error/Success Messages -->
      <div class="message-container" *ngIf="errorMessage">
        <div class="error-message" *ngIf="errorMessage">{{ errorMessage }}</div>
      </div>

      <!-- Login Form -->
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
        <!-- Email/Username Field -->
        <div class="form-group mb-2">
          <label for="username">Email</label>
          <input
            type="text"
            id="username"
            formControlName="username"
            placeholder="Enter your email"
            [class.error]="username?.invalid && username?.touched"
          />
          <div class="error-text" *ngIf="username?.invalid && username?.touched">
            <span *ngIf="username?.errors?.['required']">Email is required</span>
            <span *ngIf="username?.errors?.['minlength']">Email must be at least 3 characters</span>
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group mb-2">
          <label for="password">Password</label>
          <div class="password-input-wrapper">
            <input
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              formControlName="password"
              placeholder="Enter your password"
              [class.error]="password?.invalid && password?.touched"
            />
            <button
              type="button"
              class="password-toggle"
              (click)="togglePasswordVisibility()"
              tabindex="-1"
            >
              <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
            </button>
          </div>
          <div class="error-text" *ngIf="password?.invalid && password?.touched">
            <span *ngIf="password?.errors?.['required']">Password is required</span>
          </div>
        </div>

        <!-- Submit Button -->
        <button
          type="submit"
          class="submit-button"
          [disabled]="isLoading || loginForm.invalid"
        >
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading">Logging in...</span>
        </button>
      </form>

      <!-- Footer Links -->
      <div class="form-footer">
        <a routerLink="/registration" class="footer-link">Don't have an account? <span class="underline">Sign up</span></a>
      </div>
    </div>
  </div>
</div>
